<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Portal Siswa RPL</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="min-h-screen bg-gradient-to-br
             from-blue-600 to-indigo-800
             flex items-center justify-center p-6">


<div class="w-full max-w-md">

    <!-- LOGO -->
    <div class="text-center text-white mb-8">

        <div class="w-16 h-16 mx-auto
                    rounded-2xl bg-white
                    text-blue-600
                    flex items-center justify-center
                    font-bold text-2xl shadow-lg">
            R
        </div>

        <h1 class="text-2xl font-bold mt-4">
            Portal Siswa RPL
        </h1>

        <p class="text-blue-100 text-sm mt-1">
            SMK ICB Cinta Niaga
        </p>

    </div>


    <!-- LOGIN CARD -->
    <div class="bg-white rounded-3xl shadow-2xl p-8">

        <div class="mb-6">
            <h2 class="text-2xl font-bold">
                Selamat Datang 👋
            </h2>

            <p class="text-sm text-slate-500 mt-2">
                Silakan masuk untuk mengakses portal siswa.
            </p>
        </div>


        <form action="index.html">

            <!-- USERNAME -->
            <div class="mb-5">

                <label class="block text-sm font-semibold mb-2">
                    Username
                </label>

                <input type="text"
                       placeholder="Masukkan username"
                       required
                       class="w-full px-4 py-3
                              border border-slate-200
                              rounded-xl outline-none
                              focus:ring-2 focus:ring-blue-500">
            </div>


            <!-- PASSWORD -->
            <div class="mb-5">

                <label class="block text-sm font-semibold mb-2">
                    Password
                </label>

                <input type="password"
                       placeholder="Masukkan password"
                       required
                       class="w-full px-4 py-3
                              border border-slate-200
                              rounded-xl outline-none
                              focus:ring-2 focus:ring-blue-500">
            </div>


            <!-- REMEMBER -->
            <div class="flex items-center justify-between
                        text-sm mb-6">

                <label class="flex items-center gap-2">
                    <input type="checkbox"
                           class="w-4 h-4">
                    Ingat saya
                </label>

                <a href="#"
                   onclick="alert('Silakan hubungi guru/admin sekolah.')"
                   class="text-blue-600 hover:underline">
                    Lupa password?
                </a>

            </div>


            <!-- LOGIN -->
            <button type="submit"
                    class="w-full bg-blue-600
                           text-white py-3 rounded-xl
                           font-semibold
                           hover:bg-blue-700
                           transition">
                Masuk ke Portal
            </button>

        </form>


        <!-- BACK -->
        <div class="text-center mt-6">

            <a href="index.html"
               class="text-sm text-slate-500
                      hover:text-blue-600">
                ← Kembali ke Beranda
            </a>

        </div>

    </div>


    <p class="text-center text-blue-100
              text-xs mt-6">
        © 2026 Portal Siswa RPL
    </p>

</div>

</body>
</html>
